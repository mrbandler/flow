[workspace]
members = [
    "flow",
    "crates/core",
    "crates/app",
    "crates/cli",
    "crates/tui",
    "crates/desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Michael Baudler <hello@mrbandler.dev>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/mrbandler/flow"
homepage = "https://github.com/mrbandler/flow"
documentation = "https://docs.rs/flow"
readme = "README.md"
keywords = ["notes", "outliner", "knowledge-base", "cli", "productivity"]
categories = ["command-line-utilities", "text-editors"]
rust-version = "1.75.0"

[workspace.dependencies]
# Internal crates
flow-core = { path = "crates/core" }
flow-app = { path = "crates/app" }
flow-cli = { path = "crates/cli" }
flow-tui = { path = "crates/tui" }
flow-desktop = { path = "crates/desktop" }

# Async runtime
tokio = { version = "1", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Data structures
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# CRDT
loro = "1.0"

# Error handling
miette = { version = "7.0", features = ["fancy"] }
thiserror = "2.0"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Desktop GUI
iced = { version = "0.13", features = ["tokio"] }

# Testing
tempfile = "3.10"

[workspace.lints.rust]
# Forbid unsafe code by default
unsafe_code = "forbid"

# Deny common issues
rust_2018_idioms = { level = "deny", priority = -1 }
rust_2021_compatibility = { level = "deny", priority = -1 }

# Warn on missing docs for public items
missing_docs = "warn"
missing_debug_implementations = "warn"

# Warn on unused
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Clippy lint groups
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow some pedantic lints that are too strict
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
cognitive_complexity = "allow"
significant_drop_tightening = "allow"

# Deny serious issues
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "warn"
unimplemented = "deny"

# Style preferences
redundant_else = "warn"
match_same_arms = "warn"
semicolon_if_nothing_returned = "warn"
