name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: Flow ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref, '-') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Build binaries for all platforms
  build-release:
    name: Build (${{ matrix.target }} - ${{ matrix.variant }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: cli
            features: ""
            binary_name: flow
            asset_name: flow-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: tui
            features: "tui"
            binary_name: flow
            asset_name: flow-tui-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: gui
            features: "gui"
            binary_name: flow
            asset_name: flow-gui-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: ui
            features: "tui,gui"
            binary_name: flow
            asset_name: flow-ui-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: server
            features: "server"
            binary_name: flow
            asset_name: flow-server-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            variant: fat
            features: "all"
            binary_name: flow
            asset_name: flow-fat-linux-x86_64

          # Linux aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            variant: cli
            features: ""
            binary_name: flow
            asset_name: flow-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            variant: tui
            features: "tui"
            binary_name: flow
            asset_name: flow-tui-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            variant: gui
            features: "gui"
            binary_name: flow
            asset_name: flow-gui-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            variant: ui
            features: "tui,gui"
            binary_name: flow
            asset_name: flow-ui-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            variant: server
            features: "server"
            binary_name: flow
            asset_name: flow-server-linux-aarch64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            variant: fat
            features: "all"
            binary_name: flow
            asset_name: flow-fat-linux-aarch64

          # Linux musl (static binary)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            variant: cli
            features: ""
            binary_name: flow
            asset_name: flow-linux-x86_64-musl

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: cli
            features: ""
            binary_name: flow
            asset_name: flow-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: tui
            features: "tui"
            binary_name: flow
            asset_name: flow-tui-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: gui
            features: "gui"
            binary_name: flow
            asset_name: flow-gui-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: ui
            features: "tui,gui"
            binary_name: flow
            asset_name: flow-ui-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: server
            features: "server"
            binary_name: flow
            asset_name: flow-server-macos-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            variant: fat
            features: "all"
            binary_name: flow
            asset_name: flow-fat-macos-x86_64

          # macOS aarch64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: cli
            features: ""
            binary_name: flow
            asset_name: flow-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: tui
            features: "tui"
            binary_name: flow
            asset_name: flow-tui-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: gui
            features: "gui"
            binary_name: flow
            asset_name: flow-gui-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: ui
            features: "tui,gui"
            binary_name: flow
            asset_name: flow-ui-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: server
            features: "server"
            binary_name: flow
            asset_name: flow-server-macos-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            variant: fat
            features: "all"
            binary_name: flow
            asset_name: flow-fat-macos-aarch64

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: cli
            features: ""
            binary_name: flow.exe
            asset_name: flow-windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: tui
            features: "tui"
            binary_name: flow.exe
            asset_name: flow-tui-windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: gui
            features: "gui"
            binary_name: flow.exe
            asset_name: flow-gui-windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: ui
            features: "tui,gui"
            binary_name: flow.exe
            asset_name: flow-ui-windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: server
            features: "server"
            binary_name: flow.exe
            asset_name: flow-server-windows-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            variant: fat
            features: "all"
            binary_name: flow.exe
            asset_name: flow-fat-windows-x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install musl tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build release binary
        run: |
          cargo build --release --package flow --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }}

      - name: Prepare release artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/
          cd dist
          tar -czvf ${{ matrix.asset_name }}.tar.gz ${{ matrix.binary_name }}
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Prepare release artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "dist/"
          Compress-Archive -Path "dist/${{ matrix.binary_name }}" -DestinationPath "dist/${{ matrix.asset_name }}.zip"
          $hash = Get-FileHash "dist/${{ matrix.asset_name }}.zip" -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${{ matrix.asset_name }}.zip" | Out-File -FilePath "dist/${{ matrix.asset_name }}.zip.sha256" -Encoding ASCII

      - name: Upload release artifact (Unix)
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}.tar.gz
            dist/${{ matrix.asset_name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifact (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}.zip
            dist/${{ matrix.asset_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to crates.io (optional)
  publish-crates:
    name: Publish to crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    # Only publish on non-prerelease versions
    if: ${{ !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish flow-core
        run: cargo publish --package flow-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish flow-app
        run: cargo publish --package flow-app --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish flow-cli
        run: cargo publish --package flow-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Publish flow-tui
        run: cargo publish --package flow-tui --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Publish flow-gui
        run: cargo publish --package flow-gui --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

      - name: Wait for crates.io index update
        run: sleep 30

      - name: Publish flow
        run: cargo publish --package flow --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        continue-on-error: true

  # Update release to published (not draft)
  finalize-release:
    name: Finalize Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
